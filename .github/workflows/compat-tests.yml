# JECh compatibility tests — the `jt` harness, shipped as this branch's
# `compat-tests/` submodule.
#
# Runner: a hosted `ubuntu-latest`. There is no self-hosted machine and no Prism:
# a run compiles this checkout and launches the client through its own Gradle run
# task, so it needs a JDK, Gradle, a display and the harness's data root — nothing
# a base runner lacks. The client does need a real display, and Xvfb supplies one
# (software GL): `xvfb-run` gives DISPLAY to the whole `jt -> ./gradlew -> client`
# tree, which covers the client because the harness starts Gradle itself and
# copies its environment (`lib/instance.py`, `launch_gradle`).
#
# The shape follows JEI's own `.github/workflows/tests.yml`
# (mezz/JustEnoughItems): `actions/setup-java`, `gradle/actions/setup-gradle`
# pinned to the wrapper with the Minecraft transformation intermediates excluded
# from the Gradle User Home cache and cached separately by `actions/cache`,
# `xvfb-run` around the client run — and no account anywhere, because a Gradle dev
# run authenticates as the dev player.
#
# The checkout is placed in a directory named after this branch's envs'
# `jech.project` ("1.21.1") and `JT_JECH_ROOT` points at its parent: that is the
# layout the harness's paths are written against, `$JT_JECH_ROOT/<project_dir>`
# being the checkout a run happens in (`lib/runner.py`, `checkout_dir`).
#
# CAVEAT — the submodule URL is still the workstation's absolute path
# (`.gitmodules`: `url = /Users/.../JechGround/compat-tests`). A hosted runner
# cannot fetch that, so `submodules: recursive` below fails until the branch is
# pushed with a URL the runner can reach (the fork's compat-tests repository).
# Nothing else in this workflow depends on the workstation layout.
#
# There is deliberately no `push` trigger: a dispatch downloads mods and launches
# real Minecraft clients, so it is not something to spend on every commit. Trigger
# it by hand from the Actions tab. The `selection` input's default is this
# branch's matrix.
name: compat-tests

on:
  workflow_dispatch:
    inputs:
      selection:
        description: >-
          jt include expression: comma-separated, OR-ed terms, each `all`, an exact
          env name, `tag:<tag>` or `regex:<pattern>`. The default runs this
          branch's two rows.
        required: false
        default: "1.21.1-neoforge,1.21.1-fabric"
        type: string
      exclude:
        description: >-
          Optional second jt expression, subtracted from the selection. Leave empty
          to exclude nothing.
        required: false
        default: ""
        type: string

# One heavy run at a time per branch.
concurrency:
  group: compat-tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compat-tests:
    name: jt run
    runs-on: ubuntu-latest
    # Two rows, each with its own 600 s watchdog (`timeout_sec` in envs/*.json),
    # plus the cold first run on a fresh runner: the Minecraft toolchain and assets
    # are provisioned inside the row's own timeout, and the caches above only pay
    # off from the second dispatch onwards.
    timeout-minutes: 60
    env:
      # All jt state — the mod/HTTP caches, the vanilla-server jars, the generated
      # world seeds and `runs/` — lives under JT_HOME (`lib/paths.py`, `jt_home()`
      # and `runs_dir()`). Pinning it keeps the run, the cache path and the artifact
      # path on one directory. Without it the chain would fall through to
      # `~/.jech-compat`: the `Data/jech-compat` root it tries first is computed from
      # the checkout's own location and only exists on the workstation layout.
      JT_HOME: ${{ github.workspace }}/jt-home
      # The directory the envs' checkouts are resolved under: this branch's
      # checkout sits at <workspace>/1.21.1, exactly as `env.gradle.project_dir`
      # ("1.21.1") spells it.
      JT_JECH_ROOT: ${{ github.workspace }}
      JECH_DIR: ${{ github.workspace }}/1.21.1
    steps:
      # The branch checkout is placed under its own `jech.project` name, which is
      # what `$JT_JECH_ROOT/<project>` resolves for every env here; the submodule
      # rides along inside it.
      - name: Check out the branch and the compat-tests submodule
        uses: actions/checkout@v7
        with:
          path: 1.21.1
          submodules: recursive
          persist-credentials: false

      # JDK 21 is everything this branch needs: the wrapper is Gradle 8.13 (it
      # cannot run on 25), the client's toolchain is 21, and 21 is the JDK the
      # vanilla server wants for the world seed.
      #
      # jt resolves a per-env JDK itself. On macOS it calls
      # `/usr/libexec/java_home`; off macOS — this runner — it reads
      # `JT_JAVA_<major>_HOME` and then `JAVA_HOME`, and re-checks the answer
      # against the JDK's own `release` file (`lib/instance.py`, `java_home_for()`).
      # Pinning the variable keeps that resolution explicit instead of leaning on
      # the ambient default.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Pin JT_JAVA_21_HOME (jt's non-macOS JDK lookup)
        run: echo "JT_JAVA_21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # Xvfb gives the client a display; `lsof` is how the runner identifies a
      # Gradle-launched client — "the java process under this launcher whose working
      # directory is this run's game directory" (`lib/instance.py`,
      # `gradle_game_pids()`) — so it is a hard requirement of this backend. Both
      # are on the hosted image; install only what is missing.
      - name: Install Xvfb and lsof
        run: |
          set -euo pipefail
          missing=()
          command -v Xvfb >/dev/null 2>&1 || missing+=(xvfb)
          command -v lsof >/dev/null 2>&1 || missing+=(lsof)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Xvfb and lsof are already present on the runner image"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${missing[@]}"

      # Gradle User Home caching. `caches/neoformruntime/intermediate_results`
      # (ModDevGradle's decompiled-Minecraft output, this branch's NeoForge plugin)
      # is excluded here and cached on its own below: it is large, it is keyed by
      # the Minecraft/loader inputs rather than by this branch's sources, and it is
      # what makes a source-only change cheap.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/neoformruntime/intermediate_results

      - name: Cache Minecraft transformations
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/neoformruntime/intermediate_results
          key: neoform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('1.21.1/gradle.properties', '1.21.1/**/*.gradle', '1.21.1/gradle/wrapper/gradle-wrapper.properties', '1.21.1/**/accesstransformer.cfg') }}

      # jt's own downloads — pinned mod jars, vanilla-server jars, generated world
      # seeds — are content-addressed under `JT_HOME/cache`; a world seed costs a
      # full vanilla dedicated-server run to (re)build.
      - name: Cache jt's data (mods, server jars, world seeds)
        uses: actions/cache@v5
        with:
          path: ${{ env.JT_HOME }}/cache
          key: jt-data-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('1.21.1/compat-tests/envs/*.json') }}
          restore-keys: |
            jt-data-${{ runner.os }}-${{ github.ref_name }}-
            jt-data-${{ runner.os }}-

      # Resolving a row reads the jar the env pins (`jech.path`) even before the
      # run task would build it, so the modules under test are built first: this
      # fails on a compile error with a Gradle log, instead of inside a watchdog.
      - name: Build the modules under test
        working-directory: ${{ env.JECH_DIR }}
        run: ./gradlew :neoforge:build :fabric:build

      - name: Run compat tests
        working-directory: ${{ env.JECH_DIR }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          SELECTION: ${{ inputs.selection }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail

          echo "jt data root: $JT_HOME"
          echo "note: a fresh data root warms itself on first use (vanilla jars, assets, libraries) - a slow first run is expected"

          # A real key is injected as an environment variable and never written to
          # disk: jt reads the environment before it ever looks at
          # `<JT_HOME>/secrets.env` (`lib/secrets.py`, `get()`), and the harness
          # never prints, logs or caches the value. Failing here names the missing
          # repository secret instead of letting the first resolve fail obscurely.
          : "${CF_API_KEY:?CF_API_KEY is not set: add the repository secret (Settings > Secrets and variables > Actions > Repository secrets)}"

          # `jt run` takes ONE include expression plus an optional `--exclude`
          # (`lib/__main__.py`); the input is passed verbatim so a comma-separated
          # list keeps meaning "any of these".
          args=(python3 compat-tests/jt run "$SELECTION")
          if [ -n "${EXCLUDE// /}" ]; then
            args+=(--exclude "$EXCLUDE")
          fi

          # The client needs a display. `-s` pins a 24-bit screen on purpose: GLFW
          # asks for a visual with a real colour depth and Xvfb's default depth is
          # not enough for GL to come up.
          xvfb-run -a -s "-screen 0 1920x1080x24" "${args[@]}"

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jt-runs-${{ github.ref_name }}
          # `lib/paths.py`, `runs_dir()`: one directory per run, holding report.json
          # / report.txt / junit.xml, the gradle log, the captured game log, the
          # game directory (with the uitest report and captures for
          # 1.21.1-neoforge) and any crash reports.
          path: ${{ env.JT_HOME }}/runs
          if-no-files-found: warn
