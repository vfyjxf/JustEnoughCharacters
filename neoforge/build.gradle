plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = "${verspec}.${verbuild}"

// Optional, property-driven run wiring for the compatibility harness (jt's
// "gradle backend"): -PjechRunDir points the client at a game directory outside
// this checkout, -PjechQuickPlayWorld makes it join a world on launch. Without
// either property the run behaves exactly as before.
def jechRunDir = providers.gradleProperty("jechRunDir")
def jechQuickPlayWorld = providers.gradleProperty("jechQuickPlayWorld")

base {
    archivesName = mod_id + '-' + minecraft_version + '-neoforge'
}
neoForge {
    version = neo_version

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            if (jechRunDir.isPresent()) {
                gameDirectory = layout.dir(providers.provider { new File(jechRunDir.get()) })
            }
            if (jechQuickPlayWorld.isPresent()) {
                programArgument "--quickPlaySingleplayer"
                programArgument jechQuickPlayWorld.get()
            }
        }
    }

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly project(':common')

    jarJar(project(':coremod-neoforge'))
    jarJar(implementation("com.github.towdium:PinIn:${verpinin}"))
    clientAdditionalRuntimeClasspath "com.github.towdium:PinIn:${verpinin}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly 'com.google.auto.service:auto-service-annotations:1.1.1'
    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
}

compileJava {
    source(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_version         : version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


// The dev-only in-client UI test harness (the jechtest mod): source sets, the clientTests run and
// the -PjechTest wiring. Applied last so `version` is already set; every part of it is inert
// without -PjechTest*.
apply from: rootProject.file('gradle/jech-uitest.gradle')
